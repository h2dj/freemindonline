<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>FreeMind Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="description" content="FreeMind 스타일의 브라우저 기반 마인드맵 편집기">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2563eb">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="toolbar">
  <div class="toolbar-left">
    <div class="toolbar-group brand">🧠 FreeMind Online</div>

    <div class="toolbar-group">
      <button id="btn-menu" class="menu-toggle" title="메뉴" aria-haspopup="true" aria-expanded="false">☰ 메뉴</button>
    </div>

    <div class="toolbar-group">
      <button id="btn-add-child" title="하위 노드 추가 (Insert)">➕ 하위</button>
      <button id="btn-add-sibling" title="형제 노드 추가 (Enter)">➕ 형제</button>
      <button id="btn-delete" title="노드 삭제 (Delete)">🗑 삭제</button>
      <button id="btn-undo" title="실행 취소 (Ctrl+Z)">↶</button>
      <button id="btn-redo" title="다시 실행 (Ctrl+Shift+Z)">↷</button>
    </div>
  </div>

  <div class="toolbar-right">
    <div class="toolbar-group">
      <button id="btn-zoom-out" title="축소">−</button>
      <button id="btn-zoom-reset" title="화면 맞춤">⤢</button>
      <button id="btn-zoom-in" title="확대">+</button>
    </div>

    <div class="toolbar-group color-group" id="color-group" title="선택한 노드 색상">
      <span class="color-label">색상</span>
      <button class="swatch" data-color="" style="background:#ffffff" title="기본"></button>
      <button class="swatch" data-color="#fde68a" style="background:#fde68a" title="노랑"></button>
      <button class="swatch" data-color="#bbf7d0" style="background:#bbf7d0" title="초록"></button>
      <button class="swatch" data-color="#bfdbfe" style="background:#bfdbfe" title="파랑"></button>
      <button class="swatch" data-color="#fbcfe8" style="background:#fbcfe8" title="분홍"></button>
      <button class="swatch" data-color="#fecaca" style="background:#fecaca" title="빨강"></button>
    </div>
  </div>
</header>

<div id="file-menu" class="context-menu hidden">
  <button id="btn-new" title="새 마인드맵">📄 새로 만들기</button>
  <button id="btn-open" title="JSON 파일 열기">📂 열기</button>
  <button id="btn-save" title="JSON으로 저장 (Ctrl+S)">💾 저장</button>
  <button id="btn-export-mm" title="FreeMind(.mm)로 내보내기">⇩ .mm 내보내기</button>
  <button id="btn-import-mm" title="FreeMind(.mm) 가져오기">⇧ .mm 가져오기</button>
  <button id="btn-export-png" title="PNG 이미지로 내보내기">🖼 PNG 내보내기</button>
  <button id="btn-print" title="인쇄 (Ctrl+P)">🖨 인쇄</button>
  <button id="btn-settings" title="설정">⚙ 설정</button>
  <input type="file" id="file-input" accept=".json,application/json" hidden>
  <input type="file" id="mm-input" accept=".mm,application/xml,text/xml" hidden>
</div>

<div id="body-row">
  <aside id="icon-sidebar" title="선택한 노드에 아이콘 추가">
    <div class="icon-sidebar-header">
      <button id="icon-sidebar-toggle" class="icon-sidebar-toggle" title="아이콘 패널 접기/펼치기" aria-label="아이콘 패널 접기/펼치기">◀</button>
    </div>
    <div id="icon-sidebar-grid"></div>
  </aside>

  <main id="canvas">
    <div id="world">
      <svg id="clouds"></svg>
      <svg id="edges"></svg>
      <svg id="glinks"></svg>
      <div id="nodes"></div>
    </div>
  </main>
</div>

<div id="context-menu" class="context-menu hidden"></div>
<div id="icon-picker" class="context-menu hidden"></div>
<div id="toast" class="toast hidden"></div>

<div id="settings-backdrop" class="modal-backdrop hidden">
  <div id="settings-modal" class="modal" role="dialog" aria-modal="true" aria-label="기초 설정">
    <div class="modal-header">
      <h2>⚙ 기초 설정</h2>
      <button id="settings-close" class="modal-close" title="닫기" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body">
      <div class="setting-row">
        <label class="setting-row-label" for="setting-font-size">글자 크기</label>
        <div class="setting-control">
          <input type="range" id="setting-font-size" min="11" max="20" step="1">
          <span id="setting-font-size-value" class="setting-value">14px</span>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-row-label">노드 기본 색상</span>
        <div class="setting-control swatch-row" id="setting-node-color"></div>
      </div>
      <div class="setting-row">
        <span class="setting-row-label">중심 주제(강조) 색상</span>
        <div class="setting-control swatch-row" id="setting-accent-color"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button id="settings-reset" title="모든 설정을 기본값으로 되돌립니다">기본값으로 되돌리기</button>
      <button id="settings-done" class="primary">완료</button>
    </div>
  </div>
</div>

<footer id="statusbar">
  <span id="status-text">FreeMind Online</span>
  <span class="hint">Insert 하위 노드 · Enter 형제 노드 · F2 편집 · Delete 삭제 · Space 접기/펼치기 · 방향키 이동 · Ctrl+↑↓ 순서 변경 · Ctrl+←→ 레벨 변경 · Ctrl+K 링크 걸기 · Ctrl+Shift+J 구름 켜기/끄기 · 드래그로 이동/재배치 · 휠로 확대·축소 · 우클릭 메뉴에서 구름/링크/아이콘/화살표 링크 · Ctrl+P 인쇄 · ☰ 메뉴에서 파일/설정</span>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
